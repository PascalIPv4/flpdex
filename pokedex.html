<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex – FastlifePokemon</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #0a0f1e;
  --navy:   #1E1A52;
  --yellow: #F5C800;
  --cyan:   #58D8F8;
  --green:  #34d399;
  --text:   #e8e0d0;
  --muted:  rgba(232,224,208,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --border: rgba(245,200,0,0.2);
}
body {
  background: var(--bg); color: var(--text);
  font-family: "Rajdhani", sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--yellow);
  padding: 18px 32px;
  display: flex; align-items: center; gap: 16px;
  border-bottom: 4px solid var(--navy);
}
header h1 {
  font-family: "Press Start 2P", monospace;
  font-size: clamp(12px, 2vw, 18px);
  color: var(--navy); letter-spacing: 3px; flex: 1;
}
.header-stats {
  display: flex; gap: 20px; align-items: center;
}
.stat {
  text-align: center;
  background: var(--navy); border-radius: 8px;
  padding: 6px 14px; min-width: 80px;
}
.stat-val {
  font-family: "Press Start 2P", monospace;
  font-size: 16px; color: var(--yellow); display: block;
}
.stat-lbl {
  font-size: 10px; color: rgba(255,255,255,0.5);
  letter-spacing: 1px; display: block; margin-top: 2px;
}
.live-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: livePulse 1.5s ease infinite;
}
@keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ── FILTRES ── */
.filters {
  padding: 16px 32px; display: flex; gap: 12px; align-items: center;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
  background: rgba(0,0,0,0.2);
}
.filter-btn {
  background: var(--card-bg); border: 1px solid var(--border);
  color: var(--muted); padding: 6px 16px; border-radius: 20px;
  font-family: "Rajdhani", sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
}
.filter-btn:hover  { border-color: var(--yellow); color: var(--yellow); }
.filter-btn.active { background: var(--yellow); color: var(--navy); border-color: var(--yellow); }
.search-input {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 7px 14px;
  font-family: "Rajdhani", sans-serif; font-size: 14px; font-weight: 600;
  outline: none; transition: border-color 0.2s; margin-left: auto;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: rgba(245,200,0,0.5); }

/* ── GRILLE ── */
main {
  padding: 28px 32px;
}
.section-title {
  font-family: "Press Start 2P", monospace;
  font-size: 10px; letter-spacing: 2px; color: var(--yellow);
  margin-bottom: 18px; opacity: 0.8;
}
#pokedex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 40px;
}

/* ── CARTE POKÉMON ── */
.poke-card {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 12px; padding: 14px;
  text-align: center;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  cursor: default; position: relative; overflow: hidden;
  animation: cardIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes cardIn { from{opacity:0;transform:scale(0.8);} to{opacity:1;transform:scale(1);} }
.poke-card:hover {
  transform: translateY(-4px);
  border-color: var(--yellow);
  box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 0 16px rgba(245,200,0,0.2);
}
.poke-card img {
  width: 80px; height: 80px; object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 6px rgba(88,216,248,0.3));
}
.poke-card .poke-name {
  font-family: "Press Start 2P", monospace;
  font-size: 7px; color: var(--text); margin-top: 8px;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.poke-card .poke-chain {
  font-size: 10px; color: var(--muted); margin-top: 4px;
  font-weight: 600; letter-spacing: 0.5px;
}
.poke-card .poke-date {
  font-size: 9px; color: rgba(88,216,248,0.5); margin-top: 5px;
}
.poke-card .poke-msgs {
  font-size: 9px; color: rgba(245,200,0,0.4); margin-top: 2px;
}
/* Shimmer holo sur les cartes */
.poke-card::after {
  content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(115deg,transparent 30%,rgba(88,216,248,0.06) 45%,rgba(245,200,0,0.06) 55%,transparent 70%);
  pointer-events: none;
}
/* Badge "NOUVEAU" sur les récents */
.poke-card .new-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 6px; font-family: "Press Start 2P", monospace;
  background: var(--green); color: #000;
  padding: 2px 5px; border-radius: 3px;
  animation: newBadgePulse 2s ease infinite alternate;
}
@keyframes newBadgePulse { from{opacity:1;} to{opacity:0.5;} }

/* ── VIDE ── */
#empty-state {
  text-align: center; padding: 80px 20px;
  color: var(--muted); display: none;
}
#empty-state .big { font-size: 48px; margin-bottom: 16px; }
#empty-state p { font-size: 13px; line-height: 2; }

/* ── LOADING ── */
#loading {
  text-align: center; padding: 60px;
  font-family: "Press Start 2P", monospace;
  font-size: 10px; color: var(--cyan);
  letter-spacing: 2px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(88,216,248,0.15);
  border-top-color: var(--cyan);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to{transform:rotate(360deg);} }

/* ── FOOTER ── */
footer {
  text-align: center; padding: 20px;
  font-size: 11px; color: var(--muted);
  border-top: 1px solid var(--border);
}
footer a { color: var(--yellow); text-decoration: none; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  header { flex-direction: column; gap: 12px; }
  .header-stats { flex-wrap: wrap; justify-content: center; }
  main, .filters { padding: 16px; }
  #pokedex-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
}
</style>
</head>
<body>

<header>
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="18" stroke="#1E1A52" stroke-width="3"/>
    <path d="M2 20h36" stroke="#1E1A52" stroke-width="3"/>
    <path d="M2 20C2 10.06 10.06 2 20 2s18 8.06 18 18" fill="rgba(30,26,82,0.2)"/>
    <circle cx="20" cy="20" r="6" fill="#F5C800" stroke="#1E1A52" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="2.5" fill="#1E1A52"/>
  </svg>
  <h1>FASTLIFEPOKEMON — POKÉDEX</h1>
  <div class="header-stats">
    <div class="stat">
      <span class="stat-val" id="total-count">0</span>
      <span class="stat-lbl">ATTRAPÉS</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="total-possible">—</span>
      <span class="stat-lbl">TOTAL</span>
    </div>
    <div class="live-dot" title="Données en temps réel"></div>
  </div>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all"     onclick="setFilter('all',this)">Tous</button>
  <button class="filter-btn"        data-filter="recent"  onclick="setFilter('recent',this)">Récents</button>
  <button class="filter-btn"        data-filter="fire"    onclick="setFilter('fire',this)">🔥 Feu</button>
  <button class="filter-btn"        data-filter="water"   onclick="setFilter('water',this)">💧 Eau</button>
  <button class="filter-btn"        data-filter="grass"   onclick="setFilter('grass',this)">🌿 Plante</button>
  <input class="search-input" id="search" type="text" placeholder="Chercher un Pokémon…" oninput="applySearch()" autocomplete="off"/>
</div>

<main>
  <div class="section-title" id="grid-title">POKÉMON ATTRAPÉS EN STREAM</div>
  <div id="loading"><div class="spinner"></div>CHARGEMENT…</div>
  <div id="pokedex-grid"></div>
  <div id="empty-state">
    <div class="big">🔍</div>
    <p>Aucun Pokémon attrapé pour l'instant.<br>Venez participer au prochain stream !</p>
  </div>
</main>

<footer>
  Pokédex de <a href="https://www.twitch.tv/fastlifepokemon" target="_blank">FastlifePokemon</a>
  — Mis à jour en temps réel ✦
  <span id="last-update" style="margin-left:12px;opacity:0.5"></span>
</footer>

<script>
const FIREBASE_URL = "https://flpdex-2222b-default-rtdb.europe-west1.firebasedatabase.app";
// NOUVELLES SOURCES (Identiques au widget)
const SPRITE_ANI      = "https://play.pokemonshowdown.com/sprites/ani/";
const SPRITE_FALLBACK = "https://img.pokemondb.net/sprites/home/normal/";

const CHAIN_TYPES = {
  charmander:"fire", torchic:"fire", cyndaquil:"fire", chimchar:"fire", tepig:"fire", fennekin:"fire",
  squirtle:"water",  mudkip:"water",  totodile:"water", piplup:"water",  oshawott:"water", froakie:"water",
  bulbasaur:"grass", treecko:"grass", chikorita:"grass",turtwig:"grass", snivy:"grass",    chespin:"grass",
};
const TOTAL_CHAINS = 1000; // Mis à jour pour correspondre à ton nouveau Master Pokedex

let allCaught = [];
let currentFilter = "all";
let searchQuery   = "";

function startRealtimeSync() {
  const url = FIREBASE_URL + "/caught.json";
  async function poll() {
    try {
      const r = await fetch(url);
      const data = await r.json();
      processCaught(data);
      document.getElementById("last-update").textContent =
        "màj " + new Date().toLocaleTimeString("fr-FR");
    } catch(e) {
      console.error("Firebase poll error:", e);
    }
  }
  poll();
  setInterval(poll, 10000);
}

function processCaught(data) {
  if (!data) { allCaught = []; }
  else {
    // On transforme l'objet Firebase en tableau et on ajoute l'ID (clé) à l'objet
    allCaught = Object.keys(data).map(key => ({
      ...data[key],
      id: key 
    })).sort((a,b) => new Date(b.date) - new Date(a.date));
  }
  document.getElementById("total-count").textContent = allCaught.length;
  document.getElementById("total-possible").textContent = TOTAL_CHAINS;
  renderGrid();
}

function renderGrid() {
  const grid  = document.getElementById("pokedex-grid");
  const empty = document.getElementById("empty-state");
  const loading = document.getElementById("loading");
  if(loading) loading.style.display = "none";

  let filtered = allCaught;

  if (currentFilter === "recent") {
    const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
    filtered = filtered.filter(p => new Date(p.date).getTime() > cutoff);
  } else if (["fire", "water", "grass"].includes(currentFilter)) {
    filtered = filtered.filter(p => CHAIN_TYPES[p.id] === currentFilter);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
  }

  if (!filtered.length) {
    grid.innerHTML  = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = "";
  const now = Date.now();

  filtered.forEach((poke, i) => {
    const card  = document.createElement("div");
    card.className = "poke-card";
    card.style.animationDelay = (i * 20) + "ms";

    const caughtDate = new Date(poke.date);
    const isNew      = (now - caughtDate.getTime()) < 48 * 3600 * 1000;
    const dateStr    = caughtDate.toLocaleDateString("fr-FR", {day:"2-digit",month:"2-digit"});

    // Gestion du sprite avec fallback automatique
    const mainImgUrl = SPRITE_ANI + poke.sprite + ".gif";
    const fallbackUrl = SPRITE_FALLBACK + poke.sprite + ".png";

    card.innerHTML = `
      ${isNew ? '<span class="new-badge">NOUVEAU</span>' : ''}
      <img src="${mainImgUrl}" 
           alt="${poke.name}" 
           onerror="this.onerror=null; this.src='${fallbackUrl}';" 
           loading="lazy"/>
      <div class="poke-name">${poke.name}</div>
      <div class="poke-date">📅 ${dateStr}</div>
      ${poke.msgs ? `<div class="poke-msgs">💬 ${poke.msgs} msg</div>` : ''}
    `;

    grid.appendChild(card);
  });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderGrid();
}

function applySearch() {
  searchQuery = document.getElementById("search").value.trim();
  renderGrid();
}

startRealtimeSync();
</script>
</body>
</html>
