<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex – FastlifePokemon</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #0a0f1e;
  --navy:   #1E1A52;
  --yellow: #F5C800;
  --cyan:   #58D8F8;
  --green:  #34d399;
  --text:   #e8e0d0;
  --muted:  rgba(232,224,208,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --border: rgba(245,200,0,0.2);
}
body {
  background: var(--bg); color: var(--text);
  font-family: "Rajdhani", sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--yellow);
  padding: 18px 32px;
  display: flex; align-items: center; gap: 16px;
  border-bottom: 4px solid var(--navy);
}
header h1 {
  font-family: "Press Start 2P", monospace;
  font-size: clamp(12px, 2vw, 18px);
  color: var(--navy); letter-spacing: 3px; flex: 1;
}
.header-stats {
  display: flex; gap: 20px; align-items: center;
}
.stat {
  text-align: center;
  background: var(--navy); border-radius: 8px;
  padding: 6px 14px; min-width: 80px;
}
.stat-val {
  font-family: "Press Start 2P", monospace;
  font-size: 16px; color: var(--yellow); display: block;
}
.stat-lbl {
  font-size: 10px; color: rgba(255,255,255,0.5);
  letter-spacing: 1px; display: block; margin-top: 2px;
}
.live-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: livePulse 1.5s ease infinite;
}
@keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ── FILTRES ── */
.filters {
  padding: 16px 32px; display: flex; gap: 12px; align-items: center;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
  background: rgba(0,0,0,0.2);
}
.filter-btn {
  background: var(--card-bg); border: 1px solid var(--border);
  color: var(--muted); padding: 6px 16px; border-radius: 20px;
  font-family: "Rajdhani", sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
}
.filter-btn:hover  { border-color: var(--yellow); color: var(--yellow); }
.filter-btn.active { background: var(--yellow); color: var(--navy); border-color: var(--yellow); }
.search-input {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 7px 14px;
  font-family: "Rajdhani", sans-serif; font-size: 14px; font-weight: 600;
  outline: none; transition: border-color 0.2s; margin-left: auto;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: rgba(245,200,0,0.5); }

/* ── GRILLE ── */
main {
  padding: 28px 32px;
}
.section-title {
  font-family: "Press Start 2P", monospace;
  font-size: 10px; letter-spacing: 2px; color: var(--yellow);
  margin-bottom: 18px; opacity: 0.8;
}
#pokedex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 40px;
}

/* ── CARTE POKÉMON ── */
.poke-card {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 12px; padding: 14px;
  text-align: center;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  cursor: default; position: relative; overflow: hidden;
  animation: cardIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes cardIn { from{opacity:0;transform:scale(0.8);} to{opacity:1;transform:scale(1);} }
.poke-card:hover {
  transform: translateY(-4px);
  border-color: var(--yellow);
  box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 0 16px rgba(245,200,0,0.2);
}
.poke-card img {
  width: 80px; height: 80px; object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 6px rgba(88,216,248,0.3));
}
.poke-card .poke-name {
  font-family: "Press Start 2P", monospace;
  font-size: 7px; color: var(--text); margin-top: 8px;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.poke-card .poke-chain {
  font-size: 10px; color: var(--muted); margin-top: 4px;
  font-weight: 600; letter-spacing: 0.5px;
}
.poke-card .poke-date {
  font-size: 9px; color: rgba(88,216,248,0.5); margin-top: 5px;
}
.poke-card .poke-msgs {
  font-size: 9px; color: rgba(245,200,0,0.4); margin-top: 2px;
}
/* Shimmer holo sur les cartes */
.poke-card::after {
  content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(115deg,transparent 30%,rgba(88,216,248,0.06) 45%,rgba(245,200,0,0.06) 55%,transparent 70%);
  pointer-events: none;
}
/* Badge "NOUVEAU" sur les récents */
.poke-card .new-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 6px; font-family: "Press Start 2P", monospace;
  background: var(--green); color: #000;
  padding: 2px 5px; border-radius: 3px;
  animation: newBadgePulse 2s ease infinite alternate;
}
@keyframes newBadgePulse { from{opacity:1;} to{opacity:0.5;} }

/* ── CARTE NON ATTRAPÉE ── */
.poke-card.uncaught {
  border-color: rgba(255,255,255,0.05);
  background: rgba(255,255,255,0.02);
  opacity: 0.45;
  cursor: default;
}
.poke-card.uncaught:hover {
  transform: none;
  border-color: rgba(255,255,255,0.08);
  box-shadow: none;
}
.poke-card.uncaught img {
  filter: brightness(0) invert(0.15) saturate(0);
  opacity: 0.5;
}
.poke-card.uncaught .poke-name {
  color: rgba(255,255,255,0.2);
}
.poke-card.uncaught::after { display: none; }

/* ── VIDE ── */
#empty-state {
  text-align: center; padding: 80px 20px;
  color: var(--muted); display: none;
}
#empty-state .big { font-size: 48px; margin-bottom: 16px; }
#empty-state p { font-size: 13px; line-height: 2; }

/* ── LOADING ── */
#loading {
  text-align: center; padding: 60px;
  font-family: "Press Start 2P", monospace;
  font-size: 10px; color: var(--cyan);
  letter-spacing: 2px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(88,216,248,0.15);
  border-top-color: var(--cyan);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to{transform:rotate(360deg);} }

/* ── FOOTER ── */
footer {
  text-align: center; padding: 20px;
  font-size: 11px; color: var(--muted);
  border-top: 1px solid var(--border);
}
footer a { color: var(--yellow); text-decoration: none; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  header { flex-direction: column; gap: 12px; }
  .header-stats { flex-wrap: wrap; justify-content: center; }
  main, .filters { padding: 16px; }
  #pokedex-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
}
</style>
</head>

let caughtMap     = {}; // sprite → entry (from Firebase)
let currentFilter = "all";
let searchQuery   = "";

// ── FIREBASE POLLING ──
function startRealtimeSync() {
  async function poll() {
    try {
      const r    = await fetch(FIREBASE_URL + "/caught.json");
      const data = await r.json();
      caughtMap = data || {};
      const count = Object.keys(caughtMap).length;
      document.getElementById("total-count").textContent    = count;
      document.getElementById("total-possible").textContent = Pokedex_Master.length;
      document.getElementById("last-update").textContent    = "màj " + new Date().toLocaleTimeString("fr-FR");
      renderGrid();
    } catch(e) { console.error("Firebase poll:", e); }
  }
  poll();
  setInterval(poll, 10000);
}

// ── RENDER ──
function renderGrid() {
  const grid  = document.getElementById("pokedex-grid");
  const empty = document.getElementById("empty-state");
  document.getElementById("loading").style.display = "none";

  // --- 1. PRÉPARATION DE LA LISTE ---
  let list;

  if (currentFilter === "all") {
    // ON NE TOUCHE À RIEN : C'est ton code d'origine exact
    list = Pokedex_Master;
  } else {
    // UNIQUEMENT POUR L'ONGLET RÉCENTS
    // On filtre pour n'avoir que les attrapés et on trie par date décroissante
    list = Pokedex_Master.filter(p => caughtMap[p.s]);
    
    list.sort((a, b) => {
      const dateA = new Date(caughtMap[a.s].date).getTime();
      const dateB = new Date(caughtMap[b.s].date).getTime();
      return dateB - dateA; 
    });
  }

  // Filtre recherche texte (ton code d'origine)
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p => p.n.toLowerCase().includes(q));
  }

  if (!list.length) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  // --- 2. AFFICHAGE (Ton système de rendu original) ---
  grid.innerHTML = "";
  const now = Date.now();
  const frag = document.createDocumentFragment();

  list.forEach((poke, i) => {
    const entry    = caughtMap[poke.s];
    const isCaught = !!entry;
    // Détection "Nouveau" (48h)
    const isNew    = isCaught && (now - new Date(entry.date).getTime()) < 48 * 3600 * 1000;

    const card = document.createElement("div");
    card.className = "poke-card" + (isCaught ? "" : " uncaught");
    card.style.animationDelay = Math.min(i * 20, 600) + "ms";

    const img = document.createElement("img");
    if (isCaught) {
      img.onerror = function() { img.onerror = null; img.src = SPRITE_STATIC + poke.s + ".png"; };
      img.src = SPRITE_ANI + poke.s + ".gif";
    } else {
      img.src = SPRITE_STATIC + poke.s + ".png";
    }
    img.alt = isCaught ? poke.n : "???";
    img.loading = "lazy";

    const nameEl = document.createElement("div");
    nameEl.className   = "poke-name";
    nameEl.textContent = isCaught ? poke.n : "???";

    card.appendChild(img);
    card.appendChild(nameEl);

    if (isCaught) {
      if (isNew) {
        const badge = document.createElement("span");
        badge.className   = "new-badge";
        badge.textContent = "NEW";
        card.appendChild(badge);
      }
      const dateEl = document.createElement("div");
      dateEl.className   = "poke-date";
      // Format : Jour/Mois/Année à Heure:Min
      dateEl.textContent = "📅 " + new Date(entry.date).toLocaleString("fr-FR", {day:"2-digit",month:"2-digit",year:"2-digit", hour:"2-digit", minute:"2-digit"});
      card.appendChild(dateEl);

      if (entry.msgs) {
        const msgsEl = document.createElement("div");
        msgsEl.className   = "poke-msgs";
        msgsEl.textContent = "💬 " + entry.msgs + " msg";
        card.appendChild(msgsEl);
      }
    }
    frag.appendChild(card);
  });

  grid.appendChild(frag);
}

// ── FILTRES ──
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("pokedex-grid").dataset.sig = ""; // force re-render
  renderGrid();
}
function applySearch() {
  searchQuery = document.getElementById("search").value.trim();
  document.getElementById("pokedex-grid").dataset.sig = "";
  renderGrid();
}

// ── DÉMARRAGE ──
startRealtimeSync();
